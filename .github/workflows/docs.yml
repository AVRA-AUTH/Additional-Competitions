name: Documentation
on:
  push:
    branches:
      - master
      - main
      - Copernicus
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean 
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.AVRA_API_TOKEN }}
          accountId: ${{ secrets.ACCOUNT_ACCOUNT_ID }}
          command: pages deploy site --project-name=avra
